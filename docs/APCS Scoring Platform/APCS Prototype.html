<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>APCS Scoring · Prototype</title>
<meta name="viewport" content="width=1600">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:   #f7f6f3;
    --paper-2: #eceae4;
    --paper-3: #ffffff;
    --ink:     #15161a;
    --ink-2:   #3d4047;
    --ink-3:   #74777f;
    --ink-4:   #a4a7ad;
    --rule:    #e3e1da;
    --rule-2:  #c9c7c0;
    --hi:      #e7c44a;
    --hi-bg:   #f4e8b9;
    --warn:    #c08a2a;
    --warn-bg: #f6ecca;
    --warn-bd: #e0cf95;
    --ok:      #3f6e3c;
    --ok-bg:   #e1ebdc;
    --ok-bd:   #b8ccb1;
    --err:     #a23b2c;
    --err-bg:  #f4dcd6;
    --print:   'IBM Plex Sans', system-ui, sans-serif;
    --type:    'IBM Plex Mono', ui-monospace, monospace;
  }

  *{ box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); height: 100%; }
  body{
    margin: 0;
    font-family: var(--print);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root{ height: 100%; min-height: 100vh; }

  /* ---- primitives ---- */
  .box{
    border: 1px solid var(--rule);
    background: var(--paper-3);
    border-radius: 8px;
    position: relative;
  }
  .box.muted{ background: var(--paper-2); }
  .box.dash{ border-style: dashed; border-color: var(--rule-2); background: transparent; }
  .box.tight{ border-radius: 5px; }

  .rule{ height: 0; border-top: 1px solid var(--rule); margin: 12px 0; }
  .rule.dash{ border-top-style: dashed; border-top-color: var(--rule-2); }

  .btn{
    display: inline-flex; align-items:center; justify-content:center; gap:6px;
    border: 1px solid var(--rule-2);
    background: var(--paper-3);
    border-radius: 6px;
    padding: 8px 14px;
    font: 500 13px/1.2 var(--print);
    cursor: pointer;
    color: var(--ink);
    user-select: none;
    transition: background .12s, border-color .12s, color .12s, transform .06s;
  }
  .btn:hover{ background: var(--paper-2); border-color: var(--ink-3); }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity: .55; cursor: not-allowed; transform:none; background: var(--paper-3); border-color: var(--rule); }
  .btn.primary{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.primary:hover{ background: #2a2c33; border-color: #2a2c33; }
  .btn.ghost{ background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover{ background: var(--paper-2); color: var(--ink); }
  .btn.danger{ color: var(--err); border-color: var(--rule-2); }
  .btn.danger:hover{ background: var(--err-bg); border-color: var(--err); color: var(--err); }
  .btn.sm{ padding: 5px 10px; font-size: 12px; border-radius: 5px; }
  .btn.lg{ padding: 11px 18px; font-size: 14px; }
  .btn.icon{ padding: 7px 8px; }

  .pill{
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--rule-2);
    background: var(--paper-3);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px; font-weight: 500; line-height: 1.5;
    color: var(--ink-2);
  }
  .pill.dot::before{ content:""; width:6px; height:6px; border-radius:50%; background: var(--ink-3); display: inline-block; }
  .pill.warn{ background: var(--warn-bg); color: #6b4d14; border-color: var(--warn-bd); }
  .pill.warn.dot::before{ background: var(--warn); }
  .pill.ok{ background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
  .pill.ok.dot::before{ background: var(--ok); }

  .input, .select, .textarea{
    width: 100%;
    border: 1px solid var(--rule-2);
    background: var(--paper-3);
    border-radius: 6px;
    padding: 9px 11px;
    font: 400 13px/1.4 var(--print);
    color: var(--ink);
    transition: border-color .12s, box-shadow .12s;
  }
  .input:hover, .select:hover, .textarea:hover{ border-color: var(--ink-3); }
  .input:focus, .select:focus, .textarea:focus{ outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(21,22,26,.08); }
  .input:disabled, .textarea:disabled{ background: var(--paper-2); color: var(--ink-3); cursor: not-allowed; }
  .textarea{ resize: vertical; min-height: 80px; font-family: var(--print); }

  .input-group{
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--rule-2);
    background: var(--paper-3);
    border-radius: 6px;
    padding: 0 11px;
    transition: border-color .12s, box-shadow .12s;
  }
  .input-group:focus-within{ border-color: var(--ink); box-shadow: 0 0 0 3px rgba(21,22,26,.08); }
  .input-group input{
    border: none; background: transparent; padding: 9px 0;
    flex: 1 1 auto; min-width: 0; font: 400 13px/1.4 var(--print); color: var(--ink); outline: none;
  }
  .input-group .iconbtn{
    border: none; background: transparent; cursor: pointer; padding: 4px; color: var(--ink-3);
    border-radius: 4px; display: inline-flex;
  }
  .input-group .iconbtn:hover{ color: var(--ink); background: var(--paper-2); }

  .label{
    font: 500 11px/1 var(--print);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3);
    display: block;
  }

  .hi{
    background-image: linear-gradient(transparent 62%, var(--hi-bg) 62%, var(--hi-bg) 95%, transparent 95%);
    padding: 0 2px;
  }

  /* ---- avatar ---- */
  .avatar{
    width: 36px; height: 36px;
    border: 1px solid var(--rule-2);
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12px;
    background: var(--paper-2);
    color: var(--ink-2);
    flex-shrink: 0;
  }
  .avatar.sm{ width: 28px; height: 28px; font-size: 10px; }
  .avatar.lg{ width: 56px; height: 56px; font-size: 18px; }

  /* ---- table ---- */
  .table{ width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .table th{
    text-align: left;
    font: 500 11px/1.2 var(--print);
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-3);
    padding: 12px 10px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-2);
    position: sticky; top: 0;
  }
  .table th:first-child{ border-top-left-radius: 8px; }
  .table th:last-child{ border-top-right-radius: 8px; }
  .table td{ padding: 12px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .table tbody tr:last-child td{ border-bottom: none; }
  .table tbody tr{ transition: background .1s; }
  .table tbody tr:hover td{ background: var(--paper-2); }
  .table tr.muted td{ color: var(--ink-3); }
  .table tr.muted td .name{ color: var(--ink-2); }

  /* Brand mark in topnav uses the APC wave logo */
  .brand-logo-img{
    height: 30px;
    width: auto;
    display: block;
  }

  /* ---- login layout ---- */
  .login{
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(420px, 1fr);
    min-height: 100vh;
    background: var(--paper);
  }
  .login-art{
    background: #0d0d10;
    overflow: hidden;
    position: relative;
    min-height: 100vh;
  }
  .login-art img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  /* subtle vignette on the photo so the right edge meets the form softly */
  .login-art::after{
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to right, transparent 70%, rgba(13,13,16,.35) 100%);
  }
  .login-form-wrap{
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: var(--paper);
  }
  .login-form-wrap > div{ width: 100%; max-width: 380px; }
  @media (max-width: 880px){
    .login{ grid-template-columns: 1fr; }
    .login-art{ display: none; }
  }

  /* ---- nav ---- */
  .nav{
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-3);
    height: 60px;
  }
  .brand{
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
  }
  .brand .logo{
    width: 26px; height: 26px;
    background: var(--ink); color: var(--paper);
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }

  .row{ display:flex; gap: 12px; align-items: center; }
  .col{ display:flex; flex-direction: column; gap: 12px; }
  .grow{ flex: 1 1 auto; min-width: 0; }
  .between{ justify-content: space-between; }

  /* ---- breadcrumb ---- */
  .crumbs{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-3);
    padding: 12px 24px;
    border-bottom: 1px dashed var(--rule);
    background: var(--paper-3);
  }
  .crumbs a{ color: var(--ink-3); cursor: pointer; text-decoration: none; }
  .crumbs a:hover{ color: var(--ink); text-decoration: underline; }
  .crumbs .sep{ color: var(--ink-4); }
  .crumbs .current{ color: var(--ink); font-weight: 500; }

  /* ---- score slider ---- */
  .scoreslider{ position: relative; height: 18px; border: 1px solid var(--rule-2); border-radius: 5px; background: var(--paper-2); overflow: visible; cursor: pointer; }
  .scoreslider .fill{
    height: 100%;
    background: repeating-linear-gradient(135deg, var(--ink) 0 8px, transparent 8px 12px), var(--ink-2);
    border-radius: 4px 0 0 4px;
    pointer-events: none;
  }
  .scoreslider .handle{
    position: absolute; top: -6px;
    width: 22px; height: 30px;
    border: 1px solid var(--ink); background: var(--paper-3);
    border-radius: 5px;
    transform: translateX(-50%);
    pointer-events: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .scoreslider:focus{ outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---- modal/overlay ---- */
  .ovl{
    position: fixed; inset: 0;
    background: rgba(20,18,16,.45);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
    z-index: 50;
    animation: fadeIn .15s ease-out;
  }
  .ovl .modal{
    background: var(--paper-3);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 28px 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.06);
    max-width: 380px;
    width: 100%;
    text-align: center;
    animation: pop .18s cubic-bezier(.2,.8,.3,1.1);
  }
  .modal.left{ text-align: left; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

  /* ---- banner ---- */
  .banner{
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--warn-bd);
    background: var(--warn-bg);
    border-radius: 8px;
    color: #6b4d14;
    font-size: 13px;
  }
  .banner .icon{ flex-shrink: 0; margin-top: 2px; }
  .banner.err{ background: var(--err-bg); border-color: #d3a89f; color: var(--err); }

  /* ---- summary cards ---- */
  .stat{
    flex: 1 1 0;
    background: var(--paper-3);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 16px 18px;
    transition: border-color .12s;
  }
  .stat:hover{ border-color: var(--ink-3); }
  .stat .num{ font-size: 38px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .stat.warn .num{ color: var(--warn); }
  .stat.ok .num{ color: var(--ok); }
  .stat .delta{ font-size: 11px; color: var(--ink-3); margin-top: 6px; }

  /* fade transitions when switching screens */
  .screen{ animation: screenIn .22s cubic-bezier(.2,.8,.3,1); height: 100%; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* helper for icon buttons */
  .iconbtn-bare{ background: transparent; border: none; cursor: pointer; color: var(--ink-3); padding: 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .iconbtn-bare:hover{ color: var(--ink); background: var(--paper-2); }

  /* preset chips */
  .chip{
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--rule-2);
    background: var(--paper-3);
    border-radius: 4px;
    padding: 3px 9px;
    font-size: 11px; font-weight: 500;
    cursor: pointer;
    color: var(--ink-2);
    transition: background .1s, border-color .1s;
  }
  .chip:hover{ background: var(--paper-2); border-color: var(--ink-3); color: var(--ink); }
  .chip.active{ background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* tabs */
  .tabs{
    display: flex; gap: 2px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 14px;
    overflow-x: auto;
  }
  .tab{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border: none; background: transparent;
    font: 500 13px/1.2 var(--print);
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: color .12s, border-color .12s;
  }
  .tab:hover{ color: var(--ink); }
  .tab.active{ color: var(--ink); border-bottom-color: var(--ink); }
  .tab-count{
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 18px; padding: 0 6px;
    border-radius: 9px;
    font: 600 10px/1 var(--print);
    background: var(--warn-bg); color: #6b4d14;
    border: 1px solid var(--warn-bd);
  }
  .tab-count.active{ background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* pagination */
  .pagination{
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-top: 1px solid var(--rule);
    background: var(--paper-2);
    gap: 12px; flex-wrap: wrap;
  }

  /* score / minus inputs — show placeholder "0" in grey when empty */
  .score-input::placeholder{ color: var(--ink-4); opacity: 1; font-weight: 500; }
  .score-input::-moz-placeholder{ color: var(--ink-4); opacity: 1; font-weight: 500; }

  /* link */
  .link{ color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 2px; cursor: pointer; }
  .link:hover{ text-decoration-color: var(--ink); }

</style>
</head>
